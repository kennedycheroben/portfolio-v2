    <!-- Google Fonts Preconnect & Load: Syne, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />

    <!-- Inline Script to prevent FOUC (Flash of Unstyled Content) for theme -->
    <script>
      (function() {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const themeParam = urlParams.get('theme');
          const stored = (themeParam === 'light' || themeParam === 'dark') ? themeParam : localStorage.getItem('portfolio-theme');
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = stored ? stored : (systemDark ? 'dark' : 'dark'); // dark-first default
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-canvas text-primary antialiased selection:bg-accent selection:text-white">
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry.client.tsx"></script>
  </body>
</html>
